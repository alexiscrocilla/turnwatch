[package]
name = "monitor-core"
version = "0.3.0"
description = "Reads the state of Claude Code sessions from local files"
authors = ["Alexis Crocilla"]
license = "MIT"
repository = "https://github.com/alexiscrocilla/turnwatch"
edition = "2024"

[dependencies]
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_JobObjects", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSLocale", "NSString"] }
