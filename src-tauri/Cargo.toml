[package]
name = "turnwatch"
version = "0.1.0"
description = "Live status of the Claude Code sessions in Claude Desktop"
authors = ["Alexis Crocilla"]
license = "MIT"
repository = "https://github.com/alexiscrocilla/turnwatch"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "turnwatch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
monitor-core = { version = "0.1.0", path = "../crates/monitor-core" }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
