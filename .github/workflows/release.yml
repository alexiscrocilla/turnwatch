name: Release

# Pushing a tag such as v0.2.0 builds the installer and opens a draft release.
# Nothing is published until someone publishes that draft.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check that the tag is the app's version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = "v$version"
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build
      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src-tauri/target/release/bundle/nsis
          # GitHub turns the spaces of an asset's name into dots: name it first,
          # so that the file people download is the one the checksum names.
          installer="Claude-Session-Monitor_${VERSION}_x64-setup.exe"
          mv "Claude Session Monitor_${VERSION}_x64-setup.exe" "$installer"
          sha256sum "$installer" > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "$installer" SHA256SUMS.txt \
            --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
